name: multi-agent-portal
services:
  web:
    build: .
    ports:
      - "127.0.0.1:${PORTAL_PORT:-8086}:3000"
    environment:
      BACKEND_URL: http://api:8000
      APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN:?Run start.ps1 to generate the local token}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://portal:${POSTGRES_PASSWORD:?Run start.ps1 first}@db:5432/portal
      APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN}
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  worker:
    build: ./backend
    command: ["python", "worker.py"]
    environment:
      DATABASE_URL: postgresql://portal:${POSTGRES_PASSWORD}@db:5432/portal
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - portal-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  portal-data:
